<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="app">
        <header class="app-header">
            <h1 class="app-title">待辦清單</h1>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深色模式">
                🌙 深色模式
            </button>
        </header>

        <form id="todo-form" class="todo-form" autocomplete="off">
            <input id="todo-input" class="todo-input" type="text" placeholder="輸入待辦事項..." aria-label="待辦事項輸入框" />
            <button class="add-btn" type="submit">新增</button>
        </form>

        <div class="filters" role="group" aria-label="待辦篩選">
            <button type="button" class="filter-btn active" data-filter="all">全部</button>
            <button type="button" class="filter-btn" data-filter="active">未完成</button>
            <button type="button" class="filter-btn" data-filter="completed">已完成</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <p id="empty-state" class="empty-state">還沒有任何待辦事項,新增一個吧!</p>

        <footer class="app-footer">
            <span id="remaining-count">未完成：0 項</span>
        </footer>
    </main>

    <script src="app.js" defer></script>
</body>

</html>
